<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
<title>毒には毒をぶつけるんだよ</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0b0d12; overflow: hidden; }
  #wrap { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  #unity-container { position: relative; width: 100%; height: 100%; }
  #unity-canvas { position: absolute; background: #231F20; display: block; }
  #loading { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #cfd6e4; font-family: sans-serif; font-size: 20px; pointer-events: none; }
  #bar-empty { width: 320px; height: 12px; margin-top: 16px; background: #2a2f3b; border-radius: 6px; overflow: hidden; }
  #bar-full { width: 0%; height: 100%; background: #d8841f; }
  #unity-warning { position: absolute; left: 50%; top: 5%; transform: translate(-50%); background: white; padding: 10px; display: none; z-index: 10; }
</style>
</head>
<body>
<div id="wrap">
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading"><div>読み込み中...</div><div id="bar-empty"><div id="bar-full"></div></div></div>
    <div id="unity-warning"></div>
  </div>
</div>
<script>
  var canvas = document.querySelector('#unity-canvas');
  var container = document.querySelector('#unity-container');

  // 16:9 を保ったままウィンドウいっぱいに表示（余白は黒）
  function fitCanvas() {
    var w = container.clientWidth, h = container.clientHeight;
    var cw = w, ch = Math.round(w * 9 / 16);
    if (ch > h) { ch = h; cw = Math.round(h * 16 / 9); }
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    canvas.style.left = Math.round((w - cw) / 2) + 'px';
    canvas.style.top = Math.round((h - ch) / 2) + 'px';
  }
  window.addEventListener('resize', fitCanvas);
  fitCanvas();

  function unityShowBanner(msg, type) {
    var el = document.querySelector('#unity-warning');
    var div = document.createElement('div');
    div.innerHTML = msg;
    el.appendChild(div);
    if (type == 'error') div.style = 'background: red; padding: 10px;';
    else {
      if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
      setTimeout(function () { el.removeChild(div); el.style.display = el.children.length ? 'block' : 'none'; }, 5000);
    }
    el.style.display = el.children.length ? 'block' : 'none';
  }

  var buildUrl = 'Build';
  var config = {
    arguments: [],
    dataUrl: buildUrl + '/WebGL.data',
    frameworkUrl: buildUrl + '/WebGL.framework.js',
    codeUrl: buildUrl + '/WebGL.wasm',
    streamingAssetsUrl: 'StreamingAssets',
    companyName: 'DefaultCompany',
    productName: 'CLAUDE_01',
    productVersion: '1.0',
    showBanner: unityShowBanner,
  };

  var script = document.createElement('script');
  script.src = buildUrl + '/WebGL.loader.js';
  script.onload = function () {
    var loading = document.querySelector('#loading');
    var full = document.querySelector('#bar-full');
    createUnityInstance(canvas, config, function (p) {
      full.style.width = (100 * p) + '%';
      if (p >= 1) loading.style.display = 'none';
    }).then(function () { loading.style.display = 'none'; })
      .catch(function (m) { alert(m); });
  };
  document.body.appendChild(script);
</script>
</body>
</html>
